name: Setup ngrok and Remote Desktop

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  setup-ngrok:
    runs-on: self-hosted
    timeout-minutes: 360  # Max allowed: 6 hours

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Download ngrok (with retry)
        run: |
          retry=3
          while [ $retry -gt 0 ]; do
            curl -sSL https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz -o ngrok.tgz && break
            echo "Retrying download... ($retry left)"
            sleep 5
            retry=$((retry-1))
          done
          if [ ! -f ngrok.tgz ]; then echo "❌ Failed to download ngrok after retries." && exit 1; fi

      - name: Extract ngrok
        run: |
          tar -xvzf ngrok.tgz
          if [ ! -f ./ngrok ]; then echo "❌ Failed to extract ngrok." && exit 1; fi

      - name: Update ngrok
        run: ./ngrok update

      - name: Authenticate ngrok
        run: ./ngrok authtoken $NGROK_AUTH_TOKEN
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}

      - name: Start ngrok TCP tunnel
        run: |
          ./ngrok tcp 22 --log=stdout > ngrok.log 2>&1 &
          sleep 10
          cat ngrok.log || true

      - name: Display connection info
        run: |
          apiUrl="http://127.0.0.1:4040/api/tunnels"
          response=$(curl -s $apiUrl)
          tcpAddr=$(echo $response | jq -r '.tunnels[] | select(.proto=="tcp") | .public_url')
          if [ -n "$tcpAddr" ]; then
            echo "✅ Connect using: $tcpAddr"
          else
            echo "⚠️ Unable to fetch tunnel info yet."
          fi

      - name: Keep Alive (6 hours)
        run: |
          for i in $(seq 1 72); do
            echo "⏳ Still alive... Minute: $((i * 5))"
            sleep 300
          done
        continue-on-error: true
