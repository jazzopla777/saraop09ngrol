name: Setup Windows VM RDP on Self-Hosted Runner

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  setup-windows-vm:
    runs-on: self-hosted
    timeout-minutes: 360  # Max allowed: 6 hours

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install QEMU and KVM dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y qemu-kvm libvirt-daemon-system libvirt-clients bridge-utils curl jq

      - name: Install Docker and Setup Windows VM
        run: |
          sudo apt-get update -y
          sudo apt-get install -y docker.io qemu-kvm
          
          # systemctl ki jagah service command
          sudo service docker start || true

          sudo docker run -d \
            --name windows-vm \
            --device=/dev/kvm \
            --cap-add=NET_ADMIN \
            -p 3389:3389 \
            -p 8006:8006 \
            -e VERSION="win10" \
            -e RAM_SIZE="4G" \
            -e CPU_CORES="2" \
            dockur/windows

          echo "⏳ Waiting for Windows VM to initialize..."
          sleep 60

      - name: Download and Extract ngrok
        run: |
          retry=3
          while [ $retry -gt 0 ]; do
            curl -sSL https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz -o ngrok.tgz && break
            echo "Retrying download... ($retry left)"
            sleep 5
            retry=$((retry-1))
          done
          tar -xvzf ngrok.tgz

      - name: Authenticate ngrok
        run: ./ngrok authtoken $NGROK_AUTH_TOKEN
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}

      - name: Start ngrok TCP tunnel (Port 3389)
        run: |
          ./ngrok tcp 3389 --log=stdout > ngrok.log 2>&1 &
          sleep 10
          cat ngrok.log || true

      - name: Display connection info
        run: |
          apiUrl="http://127.0.0.1:4040/api/tunnels"
          response=$(curl -s $apiUrl)
          tcpAddr=$(echo $response | jq -r '.tunnels[] | select(.proto=="tcp") | .public_url')
          if [ -n "$tcpAddr" ]; then
            echo "✅ Connect to Windows RDP using: $tcpAddr"
            echo "👤 Default User: admin"
            echo "🔑 Default Password: (Leave blank or set via RDP)"
          else
            echo "⚠️ Unable to fetch tunnel info yet."
          fi

      - name: Keep Alive (6 hours)
        run: |
          for i in $(seq 1 72); do
            echo "⏳ Still alive... Minute: $((i * 5))"
            sleep 300
          done
        continue-on-error: true
