name: Setup Native Linux RDP on Self-Hosted Runner

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  setup-rdp:
    runs-on: self-hosted
    timeout-minutes: 360  # Max allowed: 6 hours

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Lightweight Desktop & XRDP
        run: |
          sudo apt-get update -y
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y xfce4 xfce4-goodies xrdp curl jq
          echo "xfce4-session" > ~/.xsession
          sudo service xrdp restart || true

      - name: Set Password for RDP Access
        run: |
          # User ka password P@ssw0rd! set kar rahe hain
          echo "$USER:P@ssw0rd!" | sudo chpasswd

      - name: Download and Extract ngrok
        run: |
          retry=3
          while [ $retry -gt 0 ]; do
            curl -sSL https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz -o ngrok.tgz && break
            echo "Retrying download... ($retry left)"
            sleep 5
            retry=$((retry-1))
          done
          tar -xvzf ngrok.tgz

      - name: Authenticate ngrok
        run: ./ngrok authtoken $NGROK_AUTH_TOKEN
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}

      - name: Start ngrok TCP tunnel (Port 3389)
        run: |
          ./ngrok tcp 3389 --log=stdout > ngrok.log 2>&1 &
          sleep 10
          cat ngrok.log || true

      - name: Display connection info
        run: |
          apiUrl="http://127.0.0.1:4040/api/tunnels"
          response=$(curl -s $apiUrl)
          tcpAddr=$(echo $response | jq -r '.tunnels[] | select(.proto=="tcp") | .public_url')
          if [ -n "$tcpAddr" ]; then
            cleanAddr=$(echo $tcpAddr | sed 's|tcp://||')
            echo "✅ Connect using Remote Desktop (RDP): $cleanAddr"
            echo "👤 Username: $USER"
            echo "🔑 Password: P@ssw0rd!"
          else
            echo "⚠️ Unable to fetch tunnel info yet."
          fi

      - name: Keep Alive (6 hours)
        run: |
          for i in $(seq 1 72); do
            echo "⏳ Still alive... Minute: $((i * 5))"
            sleep 300
          done
        continue-on-error: true
